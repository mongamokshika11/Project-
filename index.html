<!DOCTYPE html><html><head><title>Home</title>
<style>
:root{--pink:#ff4fa3;--blue:#4aa3ff;--bg:linear-gradient(135deg,var(--pink),var(--blue));}
body{margin:0;font-family:Arial;background:var(--bg);color:#222}
nav{background:#fff;display:flex;justify-content:center;gap:15px;padding:12px;flex-wrap:wrap}
nav a{text-decoration:none;font-weight:bold;color:#333;padding:8px 15px;border-radius:20px;transition:.3s}
nav a:hover{background:var(--pink);color:#fff}
.container{padding:20px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#fff;padding:20px;border-radius:15px;box-shadow:0 5px 12px rgba(0,0,0,.2);transition:.3s}
.card:hover{transform:translateY(-8px) scale(1.03)}
.btn{background:var(--pink);color:#fff;border:none;padding:10px;border-radius:10px;cursor:pointer}
.btn:hover{background:var(--blue)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);justify-content:center;align-items:center}
.modal-content{background:#fff;padding:20px;border-radius:15px;width:90%;max-width:400px}
.close{cursor:pointer;float:right}
form{background:#fff;padding:20px;border-radius:15px;max-width:400px;margin:auto}
label{display:block;margin-top:10px;text-align:left}
input,select,textarea{width:100%;padding:8px;border-radius:8px;margin-top:5px}
@media(max-width:600px){nav{flex-direction:column}}
</style>
<script>
function openModal(msg){document.getElementById('modalMsg').innerHTML=msg;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function validateForm(){
 let name=document.getElementById('name').value;
 let phone=document.getElementById('phone').value;
 if(name.length<3){openModal('Enter valid name');return false}
 if(phone.length!=10){openModal('Enter valid 10 digit number');return false}
 openModal('Appointment Booked Successfully');return false;
}
function searchDoctor(){
 let val=document.getElementById('search').value.toLowerCase();
 document.querySelectorAll('.doc').forEach(d=>{
  d.style.display=d.innerText.toLowerCase().includes(val)?'block':'none';
 })
}
</script>

</head><body>
<nav>
<a href="home.html">Home</a>
<a href="about.html">About</a>
<a href="doctors.html">Doctors</a>
<a href="appointment.html">Appointment</a>
 <img src"images/hospital.jpg" alt="hospital" width="300" height="250">
</nav>
<div class="container">
<h1>Healthcare Portal</h1>
<div class="grid">
<div class="card"><h3>Tests</h3><p>Blood Test, MRI, X-Ray</p>
<button class="btn" onclick="openModal('Blood Test: detects diseases.<br>MRI: detailed internal scan.<br>X-Ray: bone imaging')">Details</button></div>
<div class="card"><h3>Services</h3><p>Emergency & Surgery</p>
<button class="btn" onclick="openModal('Emergency: 24/7 ambulance.<br>Surgeries: cardiac, orthopedic, neuro')">Details</button></div>
<div class="card"><h3>Doctors</h3><p>Expert Team</p>
<button class="btn" onclick="openModal('Team includes cardiologists, neurologists with 10+ yrs experience')">Details</button></div>
</div>
</div>
<div id="modal" class="modal"><div class="modal-content"><span class="close" onclick="closeModal()">X</span><p id="modalMsg"></p></div></div>
</body></html>
